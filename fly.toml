# Ghostcut on Fly.io — Phase A host (HTTPS + persistent .data volume)
#
# First-time (from your machine, logged into flyctl):
#   fly launch --no-deploy --copy-config --name ghostcut-<you>
#   fly volumes create ghostcut_data --region <region> --size 3
#   fly secrets set GHOSTCUT_APP_URL=https://<app>.fly.dev GHOSTCUT_PUBLIC_MEDIA_BASE=https://<app>.fly.dev
#   fly deploy
#
# Optional later: fly secrets set FAL_KEY=...
# Custom domain: fly certs add ghostcut.yourdomain.com

app = "ghostcut-jacque"
primary_region = "den"

[build]

[env]
  PORT = "8080"
  HOSTNAME = "0.0.0.0"
  GHOSTCUT_DATA_DIR = "/data"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "ghostcut_data"
  destination = "/data"
